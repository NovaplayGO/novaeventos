name: Event Sync Workflow

on:
  schedule:
    - cron: '30 6 * * *' # 3:30 AM hora de Paraguay (UTC-3)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Extractor
        run: python extractor.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add events.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-sync today events JSON [skip ci]"
            git push origin main
          else
            echo "Sin cambios en los eventos."
          fi

      - name: Disparar sync_eventos_futbol en Novacenter
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/NovaplayGO/novacenter/actions/workflows/sync_eventos_futbol.yml/dispatches \
            -d '{"ref":"main"}' || echo "⚠️ No se pudo disparar el workflow en novacenter"
